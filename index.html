<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>LOOP AI</title><style>body{font-family:Arial;max-width:800px;margin:0 auto;padding:20px;background:#f8fafc}button{background:#2563eb;color:#fff;border:0;padding:10px 14px;border-radius:8px;margin:4px;cursor:pointer}input,select,textarea{padding:10px;margin:4px;border:1px solid #ccc;border-radius:8px;width:90%}.card{background:#fff;padding:16px;border-radius:12px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}</style></head><body><h1>LOOP AI - Customer Feedback Intelligence</h1><div class='card'><h3>Dashboard</h3><p>Total Feedback: <b>1284</b> | Positive: <b>68%</b> | Avg Rating: <b>4.2</b></p></div><div class='card'><h3>Feedback</h3><input id='fs' placeholder='Search feedback...' oninput='fr()'><div id='fb'></div><input id='fn' placeholder='Your Name'><input id='fm' placeholder='Feedback message'><button onclick='addF()'>Add Feedback</button></div><div class='card'><h3>Ask LOOP AI</h3><input id='q' placeholder='Ask: what is top issue?'><button onclick='ask()'>Ask</button><p id='ans'></p></div><script>let fbs=[{n:'Priya',m:'Great app, fast delivery',s:'Positive'},{n:'Rohit',m:'Delivery was late',s:'Negative'},{n:'Sana',m:'Good quality fruits',s:'Positive'}];function fr(){let q=document.getElementById('fs').value.toLowerCase();let d=document.getElementById('fb');d.innerHTML='';fbs.filter(f=>f.m.toLowerCase().includes(q)||f.n.toLowerCase().includes(q)).forEach(f=>{d.innerHTML+=`<p><b>${f.n}</b> - ${f.m} [${f.s}]</p>`});}function addF(){let n=document.getElementById('fn').value||'Guest';let m=document.getElementById('fm').value;if(!m)return;fbs.push({n,m,s:'Positive'});fr();}function ask(){let q=document.getElementById('q').value.toLowerCase();let a='Based on your feedback: 68% Positive. Top theme is Delivery speed.';if(q.includes('issue'))a='Top issue: Delivery delay reported by 12% users. Fix delivery time first.';if(q.includes('rating'))a='Average rating is 4.2 out of 5 from 1284 feedbacks.';document.getElementById('ans').innerText=a;}fr();</script></body></html>
